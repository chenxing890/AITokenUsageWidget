name: AITokenUsageWidget
options:
  bundleIdPrefix: com.chenxing.tokenusage
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  AITokenUsageWidget:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: AI 用量监控
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: App/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenxing.tokenusage.app
        PRODUCT_NAME: AITokenUsageWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TokenUsageWidgetExtension
        embed: true
  TokenUsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: AI 用量小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenxing.tokenusage.app.widget
        PRODUCT_NAME: TokenUsageWidgetExtension
